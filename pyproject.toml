[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarrah-ads-mcp"
version = "0.1.5"
description = "MCP server for Google Ads and Microsoft Advertising (Bing Ads)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]<2",
    "google-ads",
    "pandas",
    "python-dotenv",
    "httpx",
    "cryptography",
    "uvicorn[standard]",
    "requests[security]",
    "pyOpenSSL",
    "bingads",
]

[project.urls]
Homepage = "https://jarrah.agency/tools/google-and-bing-ads-mcp/"
Repository = "https://github.com/jarrah-agency/jarrah-ads-mcp"

[project.scripts]
jarrah-ads-mcp = "jarrah_ads_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["jarrah_ads_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".env",
    ".env.*",
    "*.db",
    "dist/",
    "fly.toml",
    "Dockerfile",
    "AGENTS.md",
]
