[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarrah-ads-mcp"
version = "0.1.7"
description = "MCP server for Google Ads and Microsoft Advertising (Bing Ads)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]<2",
    "google-ads",
    "pandas",
    "python-dotenv",
    "httpx",
    "cryptography",
    "uvicorn[standard]",
    "requests[security]",
    "pyOpenSSL",
    "bingads",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[project.urls]
Homepage = "https://jarrah.agency/tools/google-and-bing-ads-mcp/"
Repository = "https://github.com/jarrah-agency/jarrah-ads-mcp"

[project.scripts]
jarrah-ads-mcp = "jarrah_ads_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["jarrah_ads_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "jarrah_ads_mcp/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
